[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-society"
version = "0.1.0"
description = "A local benchmark of preventive maintenance in LLM agent societies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4"]

[tool.setuptools.packages.find]
where = ["src"]

